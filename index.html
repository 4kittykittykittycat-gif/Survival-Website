<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Haris Sabir | WAMS Student Council</title>

    <!-- Google Fonts for Divine & Majestic Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background: #FAF9F6; /* Divine Alabaster/Marble White */
            color: #0B1021; /* Deep Royal Midnight Blue */
            overflow-x: hidden;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 16, 33, 0.95); /* Deep Midnight with transparency */
            backdrop-filter: blur(10px);
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid #D4AF37; /* Royal Metallic Gold Accent */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-name {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        nav a {
            font-family: 'Cinzel', serif;
            color: #FFF;
            text-decoration: none;
            margin-left: 32px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: #D4AF37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            padding: 160px 8% 80px;
            background: radial-gradient(circle at top right, #FFF8DF 0%, #FFFFFF 50%, #E6EEFA 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            position: relative;
        }

        .hero-text {
            max-width: 750px;
        }

        .small-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #AA7C11; 
            text-transform: uppercase;
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(65px, 10vw, 130px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -2px;
            color: #0B1021;
        }

        .hero h1 span {
            color: #D4AF37;
            display: block;
            text-shadow: 2px 2px 0px rgba(11, 16, 33, 0.1);
        }

        .slogan {
            margin-top: 40px;
            font-family: 'Cinzel', serif;
            font-size: clamp(24px, 3.5vw, 42px);
            font-weight: 900;
            color: #0B1021;
            line-height: 1.2;
            max-width: 650px;
            letter-spacing: 1px;
            border-left: 4px solid #D4AF37;
            padding-left: 20px;
        }

        .grade {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
        }

        /* PHOTO BOX */
        .photo-box {
            width: 360px;
            height: 460px;
            background: #0B1021;
            border: 3px solid #D4AF37;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 40px rgba(11, 16, 33, 0.15);
            flex-shrink: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .photo-box:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 60px rgba(212, 175, 55, 0.25);
            border-color: #F3E5AB;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: sepia(10%) contrast(105%);
        }

        /* PROMISES SECTION */
        .promises {
            background: #0B1021;
            color: #FFF;
            padding: 120px 8%;
            position: relative;
            border-top: 3px solid #D4AF37;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(40px, 6vw, 70px);
            font-weight: 900;
            color: #D4AF37;
            margin-bottom: 60px;
            text-align: center;
            letter-spacing: 2px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 45px 35px;
            min-height: 300px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.06);
            border-color: #D4AF37;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .card-number {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .card h3 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #FFF;
        }

        .card p {
            color: #BDC3C7;
            line-height: 1.7;
            font-size: 15px;
        }

        /* TALK SECTION */
        .talk {
            background: linear-gradient(135deg, #AA7C11 0%, #D4AF37 50%, #F3E5AB 100%);
            padding: 110px 8%;
            text-align: center;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
        }

        .talk h2 {
            font-family: 'Cinzel', serif;
            font-size: clamp(45px, 7vw, 80px);
            line-height: 1;
            font-weight: 900;
            color: #0B1021;
            letter-spacing: 1px;
        }

        .talk p {
            max-width: 700px;
            margin: 30px auto 0;
            font-size: 20px;
            line-height: 1.6;
            font-weight: 600;
            color: #0B1021;
        }

        .talk-button {
            display: inline-block;
            margin-top: 40px;
            background: #0B1021;
            color: #D4AF37;
            padding: 18px 40px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            border: 2px solid #0B1021;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(11, 16, 33, 0.3);
        }

        .talk-button:hover {
            background: transparent;
            color: #0B1021;
        }

        /* FINAL SECTION */
        .final {
            padding: 120px 8%;
            text-align: center;
            background: #FFF;
            position: relative;
        }

        .final h2 {
            font-family: 'Cinzel', serif;
            font-size: clamp(40px, 6vw, 70px);
            font-weight: 900;
            line-height: 1.1;
            color: #0B1021;
            letter-spacing: 1px;
        }

        .final h2 span {
            color: #D4AF37;
            display: block;
            margin-top: 10px;
        }

        .stache {
            font-size: 70px;
            margin-top: 35px;
            display: inline-block;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }

        /* FOOTER */
        footer {
            background: #050811;
            color: #7F8C8D;
            text-align: center;
            padding: 35px;
            font-size: 13px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            letter-spacing: 1px;
        }

        .creator-credit {
            display: inline-block;
            margin-top: 10px;
            color: #4A5568;
            font-size: 11px;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 950px) {
            .cards {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .hero {
                flex-direction: column-reverse;
                padding-top: 140px;
                text-align: center;
            }

            .slogan {
                border-left: none;
                border-top: 3px solid #D4AF37;
                padding-left: 0;
                padding-top: 20px;
                margin: 30px auto 0;
            }

            .photo-box {
                width: 280px;
                height: 360px;
                margin: 0 auto;
            }
        }

        @media (max-width: 600px) {
            nav a {
                display: none;
            }

            .hero h1 {
                letter-spacing: 0px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-name">HARIS SABIR</div>
        <div>
            <a href="#home">HOME</a>
            <a href="#promises">PROMISES</a>
